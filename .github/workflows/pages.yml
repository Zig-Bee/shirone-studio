name: Deploy Shirone Studio

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        env:
          SVELTIA_CONTENT_REPO: ${{ github.repository_owner }}/shirone-content
          SHIRONE_SITE_URL: ${{ vars.SHIRONE_SITE_URL }}
        run: |
          npm run check
          SHIRONE_SITE_URL="${SHIRONE_SITE_URL:-https://example.com}" npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
