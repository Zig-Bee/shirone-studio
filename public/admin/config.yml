# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.205.3/schema/sveltia-cms.json
backend:
  name: github
  repo: Zig-Bee/shirone-content
  branch: main
  auth_methods:
    - token
  commit_messages:
    create: "content: 创建{{collection}}“{{slug}}”"
    update: "content: 更新{{collection}}“{{slug}}”"
    delete: "content: 删除{{collection}}“{{slug}}”"
    uploadMedia: "content: 上传“{{path}}”"
    deleteMedia: "content: 删除“{{path}}”"
site_url: http://127.0.0.1:4322
display_url: http://127.0.0.1:4322
show_preview_links: true
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
media_folder: /public/images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      max_file_size: 10485760
      slugify_filename: true
collections:
  - name: skills
    label: Skill
    label_singular: Skill
    icon: auto_awesome
    folder: content/skills
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: name
    slug: '{{fields.id}}'
    path: '{{slug}}/index'
    preview_path: '/skills/{{fields.id}}/'
    media_folder: '/public/resources/skills{{dirname}}'
    public_folder: '/resources/skills{{dirname}}'
    summary: '{{name}} · {{category}}'
    sortable_fields: [name, category]
    view_filters:
      - { label: 草稿, field: draft, pattern: true }
      - { label: 已公开, field: draft, pattern: false }
    view_groups:
      - { label: 分类, field: category }
    fields:
      - { name: id, label: 固定标识, widget: uuid, readonly: true, hint: 自动生成，用于稳定链接；改名不会改变链接 }
      - { name: name, label: 名称, widget: string }
      - { name: description, label: 用途简介, widget: text }
      - name: category
        label: 分类
        widget: relation
        collection: settings
        file: skills
        search_fields: ['categories.*.label']
        value_field: 'categories.*.key'
        display_fields: ['categories.*.label']
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - name: origin
        label: 来源类型
        widget: select
        options:
          - { label: 精选分享, value: curated }
          - { label: 自己制作, value: original }
        default: curated
      - { name: author, label: 作者, widget: string, required: false }
      - { name: version, label: 版本, widget: string, required: false }
      - { name: sourceUrl, label: 来源链接, widget: string, required: false, pattern: ['^https?://.+$', '请填写完整的 HTTP 或 HTTPS 链接'] }
      - { name: installUrl, label: 安装说明链接, widget: string, required: false, pattern: ['^https?://.+$', '请填写完整的 HTTP 或 HTTPS 链接'] }
      - name: cover
        label: 封面
        widget: image
        required: false
        choose_url: false
        media_library:
          config: { max_file_size: 10485760 }
      - name: screenshots
        label: 使用截图
        widget: list
        required: false
        default: []
        fields:
          - { name: src, label: 图片, widget: image, choose_url: false }
          - { name: alt, label: 图片说明, widget: string }
      - name: attachments
        label: 下载附件
        widget: list
        required: false
        default: []
        fields:
          - { name: label, label: 下载名称, widget: string }
          - name: src
            label: 文件
            widget: file
            choose_url: false
            media_library:
              config: { max_file_size: 10485760 }
            hint: 支持 ZIP、MD、TXT、JSON、YAML；不自动执行文件，最大 10 MB
      - { name: body, label: 使用说明与个人解读, widget: markdown, required: false, hint: 建议写明用途、安装步骤、使用示例和你的解读 }
      - { name: draft, label: 草稿（不在网站显示）, widget: boolean, default: true }
  - name: posts
    label: 文章
    label_singular: 文章
    icon: article
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    preview_path: /posts/{{dirname}}/
    identifier_field: title
    summary: "{{title}} · {{published}}"
    sortable_fields:
      fields:
        - published
        - updated
        - title
      default:
        field: published
        direction: descending
    view_filters:
      - label: 草稿
        field: draft
        pattern: ^true$
      - label: 已发布
        field: draft
        pattern: ^false$
      - label: 置顶
        field: pinned
        pattern: ^true$
      - label: 模板示例
        field: template
        pattern: ^true$
    editor:
      preview: false
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: published
        widget: datetime
        type: date
      - label: 精确发布时间
        name: publishedAt
        widget: datetime
        required: false
        input_timezone: Asia/Shanghai
        output_utc: false
        hint: 中国标准时间（Asia/Shanghai）；同一天发布多篇文章时才需要
      - label: 更新日期
        name: updated
        widget: datetime
        type: date
        required: false
      - label: 精确更新时间
        name: updatedAt
        widget: datetime
        required: false
        input_timezone: Asia/Shanghai
        output_utc: false
        hint: 中国标准时间（Asia/Shanghai）
      - label: 摘要
        name: description
        widget: text
        required: false
        default: ""
      - label: 封面
        name: image
        widget: image
        required: false
        hint: 推荐上传到文章目录并使用相对路径
      - label: 分类
        name: category
        widget: string
        required: false
        default: ""
        hint: 优先复用现有分类名称，避免 Guides 与 指南等同义重复。
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        field:
          label: 标签
          name: tag
          widget: string
      - label: 文章语言
        name: lang
        widget: select
        required: false
        default: ""
        options:
          - label: 跟随站点
            value: ""
          - label: 简体中文
            value: zh_CN
          - label: 繁體中文
            value: zh_TW
          - label: English
            value: en
          - label: 日本語
            value: ja
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 开启时只保存到内容仓，不会显示在网站；关闭后公开显示
      - label: 置顶
        name: pinned
        widget: boolean
        default: false
      - label: 开启评论
        name: comment
        widget: boolean
        default: true
      - label: URL 别名
        name: alias
        widget: string
        required: false
        hint: 可选，例如 old-post-name
      - label: 自定义永久链接
        name: permalink
        widget: string
        required: false
        hint: 可选，例如 notes/my-post
      - label: 加密文章
        name: encrypted
        widget: boolean
        default: false
      - label: 访问密码
        name: password
        widget: string
        required: false
      - label: 密码提示
        name: passwordHint
        widget: string
        required: false
        default: ""
      - label: 在首页隐藏正文
        name: hideHomeContent
        widget: boolean
        default: true
      - label: 正文
        name: body
        widget: richtext
        modes:
          - raw
          - rich_text
        hint: Shirone 扩展语法和 MDX 请使用源码模式；保存后在博客预览中确认效果
      - label: 模板示例
        name: template
        widget: boolean
        default: false
  - name: moments
    label: 说说
    label_singular: 说说
    icon: chat
    folder: content/moments
    create: true
    extension: md
    format: frontmatter
    path: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: published
    summary: "{{published}} · {{location}}"
    media_folder: /public/images/moments
    public_folder: /images/moments
    preview_path: /moments/
    editor:
      preview: false
    fields:
      - label: 发布时间
        name: published
        widget: datetime
        input_timezone: Asia/Shanghai
        output_utc: false
        hint: 中国标准时间（Asia/Shanghai）
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 开启时只保存到内容仓，不会显示在网站；关闭后公开显示
      - label: 置顶
        name: pinned
        widget: boolean
        default: false
      - label: 地点
        name: location
        widget: string
        required: false
        default: ""
      - label: 心情图标
        name: mood
        widget: string
        required: false
        default: ""
        hint: 例如 material-symbols:sentiment-excited-outline-rounded
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        field:
          label: 标签
          name: tag
          widget: string
      - label: 图片
        name: images
        widget: list
        required: false
        default: []
        fields:
          - label: 图片
            name: src
            widget: image
          - label: 替代文本
            name: alt
            widget: string
            required: false
            default: ""
      - label: 正文
        name: body
        widget: richtext
        modes:
          - raw
          - rich_text
      - label: 模板示例
        name: template
        widget: boolean
        default: false
    view_filters:
      - label: 模板示例
        field: template
        pattern: ^true$
  - name: pages
    label: 固定页面
    icon: description
    editor:
      preview: false
    files:
      - name: about
        label: 关于页面
        file: content/spec/about.md
        format: raw
        fields:
          - label: 页面正文
            name: body
            widget: richtext
            modes:
              - raw
              - rich_text
  - name: settings
    label: 基础设置
    icon: settings
    editor:
      preview: false
    files:
      - name: site
        label: 站点资料与外观
        file: config/site.yaml
        format: yaml
        fields:
          - label: 站点地址
            name: site
            widget: string
            pattern:
              - ^https?://[^\s]+$
              - 请填写完整的 http:// 或 https:// 地址
          - label: 基础路径
            name: base
            widget: string
            default: /
          - label: 站点标题
            name: title
            widget: string
          - label: 副标题
            name: subtitle
            widget: string
            required: false
          - label: 界面语言
            name: lang
            widget: select
            options:
              - label: 简体中文
                value: zh_CN
              - label: 繁體中文
                value: zh_TW
              - label: English
                value: en
              - label: 日本語
                value: ja
          - label: 建站日期
            name: established
            widget: datetime
            type: date
            format: YYYY-MM-DD
            required: false
            hint: 留空隐藏运行天数；按站点时区计算已过天数，建站当天为 0 天。
          - label: 站点时区
            name: timeZone
            widget: string
            default: Asia/Shanghai
          - label: 本地预览包含草稿
            name: showDraftsInDev
            widget: boolean
            default: false
          - label: 背景模式
            name: wallpaperMode
            widget: object
            fields:
              - label: 默认模式
                name: defaultMode
                widget: select
                options:
                  - label: 图片横幅
                    value: banner
                  - label: 纯色
                    value: none
          - label: 横幅
            name: banner
            widget: object
            fields:
              - label: 背景图片
                name: src
                widget: object
                fields:
                  - label: 桌面图片
                    name: desktop
                    widget: list
                    required: false
                    default: []
                    field:
                      label: 图片
                      name: image
                      widget: image
                      required: false
                      media_folder: /assets/images
                      public_folder: assets/images
                    hint: 建议横向图片；顺序即轮播顺序。
                  - label: 手机图片
                    name: mobile
                    widget: list
                    required: false
                    default: []
                    field:
                      label: 图片
                      name: image
                      widget: image
                      required: false
                      media_folder: /assets/images
                      public_folder: assets/images
                    hint: 建议主体居中的竖向图片。
              - label: 裁切位置
                name: position
                widget: select
                options:
                  - top
                  - center
                  - bottom
                default: center
              - label: 文字遮罩
                name: dim
                widget: object
                fields:
                  - label: 启用遮罩
                    name: enable
                    widget: boolean
                    default: true
                  - label: 遮罩浓度
                    name: opacity
                    widget: number
                    value_type: float
                    min: 0
                    max: 1
                    step: 0.01
                    default: 0.24
              - label: 横幅文字
                name: homeText
                widget: object
                fields:
                  - label: 显示文字
                    name: enable
                    widget: boolean
                    default: true
                  - label: 横幅标题
                    name: title
                    widget: string
                    required: false
                    default: ""
                    hint: 留空跟随站点标题。
                  - label: 横幅短句
                    name: subtitle
                    widget: list
                    required: false
                    default: []
                    field:
                      label: 短句
                      name: text
                      widget: text
                    hint: 清空列表跟随站点副标题。
                  - label: 打字效果
                    name: typewriter
                    widget: object
                    fields:
                      - label: 启用
                        name: enable
                        widget: boolean
                        default: false
                      - label: 打字间隔（毫秒）
                        name: speed
                        widget: number
                        value_type: int
                        min: 20
                        max: 1000
                        step: 1
                        default: 100
                      - label: 删除间隔（毫秒）
                        name: deleteSpeed
                        widget: number
                        value_type: int
                        min: 20
                        max: 1000
                        step: 1
                        default: 50
                      - label: 停留时间（毫秒）
                        name: pauseTime
                        widget: number
                        value_type: int
                        min: 0
                        max: 30000
                        step: 1
                        default: 2000
                      - label: 循环
                        name: loop
                        widget: boolean
                        default: true
              - label: 轮播
                name: carousel
                widget: object
                fields:
                  - label: 启用轮播
                    name: enable
                    widget: boolean
                    default: true
                  - label: 切换间隔（毫秒）
                    name: interval
                    widget: number
                    value_type: int
                    min: 3000
                    max: 60000
                    step: 1
                    default: 6000
                  - label: 过渡时长（毫秒）
                    name: fadeDuration
                    widget: number
                    value_type: int
                    min: 0
                    max: 5000
                    step: 1
                    default: 1200
                  - label: 运镜效果
                    name: animation
                    widget: select
                    options:
                      - none
                      - ken-burns
                      - zoom-in
                      - zoom-out
                      - pan-left
                      - pan-right
                    default: none
              - label: 底部波浪
                name: waves
                widget: object
                fields:
                  - label: 显示波浪
                    name: enable
                    widget: boolean
                    default: true
          - label: 主题颜色
            name: themeColor
            widget: object
            fields:
              - label: 色相
                name: hue
                widget: number
                value_type: int
                min: 0
                max: 360
                step: 1
                default: 315
              - label: 固定颜色
                name: fixed
                widget: boolean
                default: false
              - label: 配色
                name: style
                widget: select
                options:
                  - tonalSpot
                  - vibrant
                  - content
                  - expressive
                  - rainbow
                  - fruitSalad
                  - monochrome
                  - neutral
                  - fidelity
                default: tonalSpot
              - label: 色彩规范
                name: spec
                widget: select
                options:
                  - "2021"
                  - "2025"
                default: "2025"
      - name: profile
        label: 个人资料
        file: config/profile.yaml
        format: yaml
        fields:
          - label: 头像
            name: avatar
            widget: image
            required: false
            media_folder: /assets/images
            public_folder: assets/images
          - label: 昵称
            name: name
            widget: string
            required: false
            default: ""
            hint: 留空跟随站点标题。
          - label: 简介
            name: bio
            widget: text
            required: false
            default: ""
            hint: 留空跟随站点副标题。
          - label: 社交链接
            name: links
            widget: list
            required: false
            default: []
            fields:
              - label: 名称
                name: name
                widget: string
              - label: 图标
                name: icon
                widget: string
                hint: Iconify 图标名
              - label: 地址
                name: url
                widget: string
                pattern:
                  - ^https?://[^\s]+$
                  - 请填写完整的 http:// 或 https:// 地址
            hint: 仅添加你实际使用的账号；删除列表项即隐藏入口。
      - name: music
        label: 音乐播放器
        file: config/music.yaml
        format: yaml
        fields:
          - label: 启用播放器
            name: enable
            widget: boolean
            default: false
            hint: 开启后仍需选择“内容仓内置歌曲”、添加手动歌曲，或填写外部歌单 ID。
          - label: 歌曲来源
            name: provider
            widget: select
            options:
              - label: 内容仓内置歌曲
                value: local
              - label: 手动管理歌曲
                value: custom
              - label: 外部歌单
                value: meting
              - label: 手动歌曲加外部歌单
                value: mixed
            default: local
          - label: 歌曲
            name: tracks
            widget: list
            required: false
            default: []
            fields:
              - label: 唯一编号
                name: id
                widget: string
                hint: 例如 song-1；同一歌单不能重复。
              - label: 歌名
                name: title
                widget: string
              - label: 歌手
                name: artist
                widget: string
                required: false
              - label: 音频
                name: source
                widget: file
                media_folder: /public/audio/uploads
                public_folder: /audio/uploads
                hint: 上传音频或填写 HTTPS 音频地址。
              - label: 歌曲封面
                name: cover
                widget: image
                required: false
                media_folder: /assets/images
                public_folder: assets/images
              - label: 时长（秒，可选）
                name: duration
                widget: number
                value_type: int
                min: 1
                max: 86400
                step: 1
                required: false
            summary: "{{fields.title}} · {{fields.artist}}"
            hint: “手动管理歌曲”模式至少需要一首具有唯一编号、歌名和音频的歌曲。
          - label: 外部歌单
            name: meting
            widget: object
            fields:
              - label: 平台
                name: server
                widget: select
                options:
                  - netease
                  - tencent
                  - kugou
                default: netease
              - label: 类型
                name: type
                widget: select
                options:
                  - playlist
                  - song
                  - album
                  - artist
                default: playlist
              - label: 歌单或歌曲 ID
                name: id
                widget: string
                required: false
                default: ""
          - label: 默认音量
            name: defaultVolume
            widget: number
            value_type: float
            min: 0
            max: 1
            step: 0.05
            default: 0.7
          - label: 播放顺序
            name: defaultMode
            widget: select
            options:
              - sequence
              - repeat-one
              - shuffle
            default: sequence
      - name: announcement
        label: 公告
        file: config/announcement.yaml
        format: yaml
        fields:
          - label: 标题
            name: title
            widget: string
            required: false
            default: ""
          - label: 内容
            name: content
            widget: text
            required: false
            default: ""
          - label: 允许关闭
            name: closable
            widget: boolean
            default: true
          - label: 公告链接
            name: link
            widget: object
            fields:
              - label: 显示链接
                name: enable
                widget: boolean
                default: false
              - label: 链接文字
                name: text
                widget: string
                required: false
                default: ""
              - label: 链接地址
                name: url
                widget: string
                required: false
                default: ""
                pattern:
                  - ^(https?://[^\s]+|/[^\s]*|)$
                  - 请输入网址或站内路径
              - label: 外部链接
                name: external
                widget: boolean
                default: true
      - name: skills
        label: Skill 栏目设置
        file: config/skills.yaml
        format: yaml
        fields:
          - { name: enable, label: 启用栏目, widget: boolean, default: true }
          - { name: mode, widget: hidden, default: resources }
          - { name: resourceSource, widget: hidden, default: collection }
          - name: categories
            label: 分类
            widget: list
            fields:
              - { name: key, label: 固定标识, widget: string, pattern: ['^[a-z0-9][a-z0-9-]*$', '使用小写英文、数字和短横线'], hint: 有条目引用时不要删除或改动标识 }
              - { name: label, label: 分类名称, widget: string }
      - name: sidebar
        label: 首页与侧栏布局
        file: config/sidebar.yaml
        format: yaml
        fields:
          - label: 显示侧栏
            name: enable
            widget: boolean
            default: true
          - label: 博客两列工作区
            name: blogWorkspace
            widget: boolean
            required: false
            default: false
            hint: 博客和文章使用分类侧栏与内容两列，主页继续沿用下方配置。
          - label: 栏数
            name: arrangement
            widget: select
            options:
              - label: 单侧栏
                value: single
              - label: 双侧栏
                value: dual
            default: dual
          - label: 主侧栏位置
            name: side
            widget: select
            options:
              - left
              - right
            default: left
          - label: 模块顺序
            name: components
            widget: list
            required: false
            default: []
            fields:
              - label: 模块
                name: type
                widget: select
                options:
                  - profile
                  - music
                  - announcement
                  - categories
                  - tags
                  - stats
                  - calendar
                  - toc
              - label: 显示
                name: enable
                widget: boolean
                default: true
              - label: 停靠方式
                name: slot
                widget: select
                options:
                  - top
                  - sticky
                default: top
              - label: 所在列
                name: column
                widget: select
                options:
                  - primary
                  - secondary
                default: primary
              - label: 显示页面
                name: pages
                widget: select
                options:
                  - home
                  - blog
                  - archive
                  - friends
                  - moments
                  - anime
                  - compass
                  - skills
                  - projects
                  - devices
                  - timeline
                  - albums
                  - about
                  - categories
                  - tags
                  - rss
                  - atom
                  - post
                multiple: true
                required: false
                default: []
                hint: 留空表示所有页面。
            summary: "{{fields.type}} · {{fields.enable}}"
            hint: 拖动调整顺序；关闭模块保留其配置。音乐还需在音乐设置中启用。
      - name: nav-bar
        label: 顶部导航
        file: config/nav-bar.yaml
        format: yaml
        fields:
          - label: 导航项目
            name: links
            widget: list
            required: false
            default: []
            fields:
              - &a1
                label: 内置栏目
                name: preset
                widget: select
                options:
                  - Home
                  - Archive
                  - Blog
                  - Friends
                  - Moments
                  - Anime
                  - Compass
                  - Skills
                  - Projects
                  - Devices
                  - Timeline
                  - Albums
                  - Categories
                  - Tags
                  - About
                  - GitHub
                required: false
              - &a2
                label: 自定义名称
                name: name
                widget: string
                required: false
                hint: 内置栏目可留空；自定义链接必须填写。
              - &a3
                label: 地址
                name: url
                widget: string
                required: false
                pattern:
                  - ^(https?://[^\s]+|/[^\s]*|)$
                  - 请输入完整网址或 / 开头的站内路径
              - &a4
                label: 图标
                name: icon
                widget: string
                required: false
              - &a5
                label: 外部链接
                name: external
                widget: boolean
                default: false
              - label: 子菜单
                name: children
                widget: list
                required: false
                default: []
                fields:
                  - *a1
                  - *a2
                  - *a3
                  - *a4
                  - *a5
            hint: 顺序即展示顺序。移除入口不会删除页面内容；有内容后再添加栏目。
